<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · NasManager</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1f2a44 0%, #2b6cb0 100%);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: #fff; border-radius: 14px; padding: 30px 28px; width: 360px; max-width: 100%;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 8px; background: #1f2a44; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .brand h1 { font-size: 19px; margin: 0; color: #1f2a44; }
  .sub { font-size: 13px; color: #888; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #555; margin: 0 0 6px; }
  input {
    width: 100%; padding: 11px 12px; border: 1px solid #c9d2dc; border-radius: 8px;
    font-size: 14px; margin-bottom: 14px; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: #2b6cb0; }
  button.primary {
    width: 100%; padding: 11px; border: none; border-radius: 8px; cursor: pointer;
    background: #2b6cb0; color: #fff; font-size: 15px; font-weight: 600;
  }
  button.primary:hover { background: #2f76c2; }
  button.primary:disabled { opacity: .6; cursor: default; }
  .err { color: #c0392b; font-size: 13px; margin: -4px 0 12px; min-height: 16px; }
  .foot { margin-top: 14px; font-size: 12px; color: #aaa; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="logo">N</span><h1>NasManager</h1></div>
    <p class="sub">类 NAS 文件管理 · 请输入凭据以访问</p>
    <!-- 重要：onsubmit="return false" 在 HTML 层硬拦截，表单绝不会以 GET 跳转到带凭据的 URL -->
    <form id="loginForm" autocomplete="on" onsubmit="return false;">
      <label for="user">用户名</label>
      <input id="user" name="username" type="text" placeholder="用户名" autocomplete="username" required />
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password" placeholder="密码" autocomplete="current-password" required />
      <div class="err" id="err"></div>
      <button class="primary" id="submitBtn" type="submit">登 录</button>
    </form>
    <div class="foot">数据不落系统盘 · 回收站 · 断点续传 · 预览编辑</div>
  </div>

<script>
// ============ 纯 JS SHA-256（不依赖 crypto.subtle，局域网 http 也可用） ============
// 用于把密码哈希后再提交，绝不明文发送密码；与 Node crypto 的 SHA-256 结果一致。
function sha256hex(message) {
  function rrot(x, n) { return (x >>> n) | (x << (32 - n)); }
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  const H0 = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes = new TextEncoder().encode(message);
  const ml = bytes.length * 8;
  const withOne = bytes.length + 1;
  const k = (56 - (withOne % 64) + 64) % 64;
  const total = withOne + k + 8;
  const buf = new Uint8Array(total);
  buf.set(bytes);
  buf[bytes.length] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(ml / 4294967296));
  dv.setUint32(total - 4, ml >>> 0);
  const w = new Uint32Array(64);
  const H = H0.slice();
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rrot(w[i-15],7) ^ rrot(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rrot(w[i-2],17) ^ rrot(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = rrot(e,6) ^ rrot(e,11) ^ rrot(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rrot(a,2) ^ rrot(a,13) ^ rrot(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h=g; g=f; f=e; e=(d + t1) | 0; d=c; c=b; b=a; a=(t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

(async function () {
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();              // JS 层再次拦截，双保险
    errEl.textContent = '';
    const username = document.getElementById('user').value.trim();
    const password = document.getElementById('pass').value;
    if (!username || !password) { errEl.textContent = '请输入用户名和密码'; return; }
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      // 始终发送 SHA-256(password)，绝不明文发送密码；也不写入任何 URL
      const passwordHash = sha256hex(password);
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, passwordHash: passwordHash })
      });
      if (r.status === 401) { errEl.textContent = '用户名或密码错误'; }
      else if (!r.ok) { errEl.textContent = '连接失败，请确认服务已启动'; }
      else {
        // 成功后跳转：replace 不会在地址栏留下任何凭据
        window.location.replace('/');
        return;
      }
    } catch (ex) {
      errEl.textContent = '网络错误，请重试';
    }
    btn.disabled = false; btn.textContent = '登 录';
  });
})();
</script>
</body>
</html>
